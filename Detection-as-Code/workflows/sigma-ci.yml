name: Sigma CI

on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  validate-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install sigma CLI
        run: |
          python -m pip install --upgrade pip
          pip install sigma-cli

      - name: Validate Sigma rules
        run: |
          sigma validate rules/sigma --fail-on warn

      - name: Scan samples with rules
        run: |
          # Scansione di esempio: evidenzia gli eventi che matchano
          sigma scan -r rules/sigma samples --verbose || true

      - name: Print rule catalog (optional)
        if: exists('rule_config.yaml')
        run: |
          echo "===== rule_config.yaml ====="
          cat rule_config.yaml
